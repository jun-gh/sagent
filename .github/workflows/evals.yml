name: Systematic AI Evals Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

jobs:
  evals:
    name: Golden Benchmark Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Systematic AI Evals Suite
        id: run_evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DATABASE_URL: sqlite+aiosqlite:///./eval_test.db
          PYTHONPATH: backend
        run: |
          python backend/scripts/run_evals.py --ci --threshold 85.0 --output eval_report.md

      - name: Publish Markdown Summary to Job Summary
        if: always()
        run: |
          if [ -f eval_report.md ]; then
            cat eval_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sagent-eval-report
          path: eval_report.md
          retention-days: 14
