<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- 'S' Letter Gradient -->
    <linearGradient id="sGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="12" />

  <!-- Inner Soft Accent Ring -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />

  <!-- Bold, High-Contrast Modern Geometric Capital 'S' -->
  <path d="M 336 172
           C 336 136, 304 116, 256 116
           C 200 116, 168 142, 168 184
           C 168 226, 198 244, 250 258
           L 272 264
           C 328 278, 356 302, 356 344
           C 356 392, 314 420, 256 420
           C 192 420, 152 384, 150 334
           L 204 334
           C 206 362, 226 376, 256 376
           C 288 376, 308 360, 308 338
           C 308 308, 284 294, 234 280
           L 214 274
           C 162 260, 126 234, 126 186
           C 126 138, 172 104, 256 104
           C 334 104, 380 138, 382 172
           Z"
        fill="url(#sGradient)"
        filter="url(#subtleGlow)" />
</svg>
